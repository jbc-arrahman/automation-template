[project]
name = "browser-use-boilerplate"
version = "0.1.0"
description = "Starter kit for AI browser automation with browser-use + any LLM (Gemini recommended)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Pinned for reproducible installs. browser-use pins requests/pydantic exactly,
    # so let it choose those - do not pin them here.
    "browser-use==0.13.8",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# browser-use ships Gemini, OpenAI, Anthropic, Azure, Groq, Ollama, DeepSeek, OpenRouter... clients
# out of the box. These extras are only needed for the providers that use an extra SDK.
aws = ["boto3>=1.34"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
bub = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "browser: starts a real browser (no LLM call)",
    "llm: calls a real LLM API (costs money, needs an API key)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
